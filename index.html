<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SeaState &mdash; G2 marine conditions HUD</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e0f;
        --panel: #131819;
        --line: #222c2d;
        --ink: #d6e4e2;
        --dim: #6d807e;
        --accent: #5affbe;
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(120% 90% at 50% 0%, #16211f 0%, var(--bg) 62%);
        color: var(--ink);
      }

      #preview[hidden] { display: none; }

      #preview {
        width: min(920px, 100%);
        display: grid;
        gap: 18px;
      }

      header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; }
      .sub { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }

      .stage {
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        display: grid;
        place-items: center;
      }

      /* Stand-in for the G2's 576x288 field of view: the HUD image container
         occupies the middle 288x144 of it. */
      .visor {
        position: relative;
        width: 100%;
        max-width: 864px;
        aspect-ratio: 2 / 1;
        border-radius: 10px;
        background: #05100c;
        box-shadow: inset 0 0 60px rgba(90, 255, 190, 0.05);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .visor::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.022) 0 1px,
          transparent 1px 3px
        );
      }

      canvas { display: block; image-rendering: pixelated; }

      .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      button {
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.14em;
        padding: 7px 13px;
        color: var(--dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        transition: color 120ms, border-color 120ms, background 120ms;
      }
      button:hover { color: var(--ink); border-color: #354443; }
      button.is-active { color: #04140f; background: var(--accent); border-color: var(--accent); }

      .spacer { flex: 1; }

      #link-status {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--dim);
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      #link-status::before {
        content: "";
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #3d4b4a;
      }
      #link-status.is-live { color: var(--accent); }
      #link-status.is-live::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

      footer { color: var(--dim); font-size: 11px; line-height: 1.7; }
      kbd {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="preview" hidden>
      <header>
        <h1>SeaState</h1>
        <span class="sub">Even Realities G2 &middot; 288 &times; 144 HUD preview</span>
      </header>

      <div class="stage">
        <div class="visor"><canvas id="hud-canvas"></canvas></div>
      </div>

      <div class="controls">
        <div id="screen-tabs" class="controls"></div>
        <button type="button" id="night-toggle">NIGHT</button>
        <span class="spacer"></span>
        <span id="link-status">NMEA offline</span>
      </div>

      <footer>
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change screen &middot; <kbd>N</kbd> night mode.
        On the glasses: tap to advance, swipe up for the previous screen, swipe down
        for night mode, double tap to exit.
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
