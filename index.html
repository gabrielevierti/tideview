<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SeaState</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f0e;
        --panel: #141a19;
        --line: #26302e;
        --text: #d7e3e0;
        --dim: #7c8b88;
        --phosphor: #5affbe;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 Inter, system-ui, sans-serif;
      }
      body { display: grid; place-items: center; }
      #preview[hidden] { display: none; }
      .shell { display: flex; flex-direction: column; gap: 14px; padding: 24px; }
      .stage {
        background: #000;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        line-height: 0;
      }
      canvas { image-rendering: pixelated; display: block; }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .group { display: flex; align-items: center; gap: 8px; }
      .group + .group { margin-left: auto; }
      button {
        appearance: none;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--dim); }
      button.is-active { border-color: var(--phosphor); color: var(--phosphor); }
      .meta { color: var(--dim); font-variant-numeric: tabular-nums; }
      .dot::before {
        content: "";
        display: inline-block;
        width: 7px; height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--dim);
        vertical-align: middle;
      }
      .dot.is-live::before { background: var(--phosphor); }
      kbd {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <div id="preview" hidden>
      <div class="shell">
        <div class="stage"><canvas id="screen"></canvas></div>
        <div class="bar">
          <div class="group" id="screen-tabs"></div>
          <div class="group">
            <button type="button" id="night-toggle">Night</button>
            <button type="button" id="surface-toggle">Filled</button>
          </div>
          <div class="group">
            <span class="dot meta" id="link-status">No fix</span>
            <span class="meta" id="stats">—</span>
          </div>
        </div>
        <div class="bar meta">
          <kbd>←</kbd> <kbd>→</kbd> screen · <kbd>1</kbd>–<kbd>4</kbd> jump ·
          <kbd>N</kbd> night · <kbd>S</kbd> surface
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
