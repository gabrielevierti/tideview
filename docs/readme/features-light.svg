<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-label="Features: Four marine screens: Navigation, wind, sea state and weather, paged with a tap and a swipe, hands free.; Apparent wind, no mast unit: True wind from the forecast plus your GPS track gives apparent wind, point of sail and VMG.; The sea, drawn to scale: Wave profile computed from height and period, so the steepness on the lens matches the water.; Phone GPS + Open-Meteo: No API key and no hardware: it works the moment it is installed.; 3–4% ink per screen: Outline-first design keeps the sea visible; tests assert the ink budget for every screen.; Night mode: One brightness scalar dims the whole design, automatically outside daylight hours."><title>Features: Four marine screens: Navigation, wind, sea state and weather, paged with a tap and a swipe, hands free.; Apparent wind, no mast unit: True wind from the forecast plus your GPS track gives apparent wind, point of sail and VMG.; The sea, drawn to scale: Wave profile computed from height and period, so the steepness on the lens matches the water.; Phone GPS + Open-Meteo: No API key and no hardware: it works the moment it is installed.; 3–4% ink per screen: Outline-first design keeps the sea visible; tests assert the ink budget for every screen.; Night mode: One brightness scalar dims the whole design, automatically outside daylight hours.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="0.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Four marine screens</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#59636e">Navigation, wind, sea state and weather, paged</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#59636e">with a tap and a swipe, hands free.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="0.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Apparent wind, no mast unit</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#59636e">True wind from the forecast plus your GPS track</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#59636e">gives apparent wind, point of sail and VMG.</text></g><g><rect x="0.5" y="128.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="128.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="152" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="152" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 160)"><path d="M2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="170" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">The sea, drawn to scale</text><text x="84.0" y="194" class="sans" font-size="13.5" fill="#59636e">Wave profile computed from height and period, so</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#59636e">the steepness on the lens matches the water.</text></g><g><rect x="488.5" y="128.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="128.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="152" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="152" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 160)"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="170" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Phone GPS + Open-Meteo</text><text x="572.0" y="194" class="sans" font-size="13.5" fill="#59636e">No API key and no hardware: it works the moment it</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#59636e">is installed.</text></g><g><rect x="0.5" y="256.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="256.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="280" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="280" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 288)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="298" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">3–4% ink per screen</text><text x="84.0" y="322" class="sans" font-size="13.5" fill="#59636e">Outline-first design keeps the sea visible; tests</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#59636e">assert the ink budget for every screen.</text></g><g><rect x="488.5" y="256.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="256.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="280" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="280" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 288)"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="298" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Night mode</text><text x="572.0" y="322" class="sans" font-size="13.5" fill="#59636e">One brightness scalar dims the whole design,</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#59636e">automatically outside daylight hours.</text></g></svg>
